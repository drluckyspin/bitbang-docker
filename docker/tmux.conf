# System-wide tmux config for the go-remote session. A ~/.tmux.conf in the home volume overrides it.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[#S] "
set -g status-right "go-remote  %H:%M"

# Phone key bar. BitBang's browser terminal has no Esc or Ctrl keys, and xterm.js ignores swipes while tmux has
# mouse mode on, but taps arrive as clicks. So the second status row is a set of tappable keys; PgUp and PgDn page
# through the scrollback, and paging back to the bottom leaves it. Kept under 48 columns to fit a phone.
# GR_KEY_BAR=false in .env hides the row (no, off and 0 work too, in any case); tmux reads it when the server starts.
%if "#{==:#{m/ri:^(false|no|off|0)$,$GR_KEY_BAR},0}"
set -g status 2
%endif
set -g status-format[1] '#[align=centre]#[range=user|Escape]#[bg=colour240,fg=colour255] Esc #[default]#[norange] #[range=user|C-c]#[bg=colour240,fg=colour255] ^C #[default]#[norange] #[range=user|Tab]#[bg=colour240,fg=colour255] Tab #[default]#[norange] #[range=user|BTab]#[bg=colour240,fg=colour255] ⇧Tab #[default]#[norange] #[range=user|Up]#[bg=colour240,fg=colour255] ↑ #[default]#[norange] #[range=user|Down]#[bg=colour240,fg=colour255] ↓ #[default]#[norange] #[range=user|page-up]#[bg=colour240,fg=colour255] PgUp #[default]#[norange] #[range=user|page-down]#[bg=colour240,fg=colour255] PgDn #[default]#[norange]'

# The tmux command for a tapped key, as a format: run -C expands formats, send-keys -F does not.
set -g @bbd-tap '#{?#{==:#{mouse_status_range},page-up},copy-mode -eu,#{?#{==:#{mouse_status_range},page-down},#{?pane_in_mode,send-keys -X page-down,},#{?#{m/r:^(Escape|C-c|Tab|BTab|Up|Down)$,#{mouse_status_range}},send-keys #{mouse_status_range},}}}'

# tmux reports a second and third tap in quick succession as SecondClick and TripleClick, not MouseDown.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},window}' { select-window -t = } { run -C '#{E:@bbd-tap}' }
bind -n SecondClick1Status run -C '#{E:@bbd-tap}'
bind -n TripleClick1Status run -C '#{E:@bbd-tap}'
