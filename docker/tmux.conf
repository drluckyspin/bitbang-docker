# System-wide tmux config for the bitbang-docker session. A ~/.tmux.conf in the home volume overrides it.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g status-left "[#S] "
set -g status-right "bitbang-docker  %H:%M"
